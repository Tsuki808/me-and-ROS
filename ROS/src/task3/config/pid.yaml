# Distances and linear speeds use turtlesim coordinate units, not calibrated SI.
control_rate: 20.0
max_linear_speed: 3.0
max_angular_speed: 4.0
stop_distance: 0.10
resume_distance: 0.15
tf_timeout: 0.50
max_dt: 0.50

linear_pid:
  kp: 1.20
  ki: 0.15
  kd: 0.08
  integral_limit: 0.50
  integral_zone: 1.00
  derivative_tau: 0.10

angular_pid:
  kp: 4.00
  ki: 0.10
  kd: 0.15
  integral_limit: 0.50
  integral_zone: 0.50
  derivative_tau: 0.10
