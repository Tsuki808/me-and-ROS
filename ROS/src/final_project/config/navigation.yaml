controller_frequency: 8.0
planner_frequency: 1.0
planner_patience: 10.0
controller_patience: 10.0
recovery_behavior_enabled: true
clearing_rotation_allowed: false
shutdown_costmaps: false
base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 1.0
  transform_tolerance: 0.5
  footprint: [[-0.24, -0.18], [-0.24, 0.18], [0.24, 0.18], [0.24, -0.18]]
  plugins:
    - {name: static, type: 'costmap_2d::StaticLayer'}
    - {name: obstacles, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation, type: 'costmap_2d::InflationLayer'}
  obstacles:
    observation_sources: laser
    laser: {data_type: LaserScan, topic: /scan, marking: true, clearing: true, obstacle_range: 3.0, raytrace_range: 3.5}
  inflation: {inflation_radius: 0.35, cost_scaling_factor: 8.0}
local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 5.0
  publish_frequency: 2.0
  always_send_full_costmap: true
  transform_tolerance: 0.5
  rolling_window: true
  width: 3.0
  height: 3.0
  resolution: 0.05
  footprint: [[-0.24, -0.18], [-0.24, 0.18], [0.24, 0.18], [0.24, -0.18]]
  plugins:
    - {name: obstacles, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation, type: 'costmap_2d::InflationLayer'}
  obstacles:
    observation_sources: laser
    laser: {data_type: LaserScan, topic: /scan, marking: true, clearing: true, obstacle_range: 3.0, raytrace_range: 3.5}
  inflation: {inflation_radius: 0.35, cost_scaling_factor: 8.0}
DWAPlannerROS:
  max_vel_x: 0.18
  min_vel_x: -0.06
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.18
  min_vel_trans: 0.02
  max_vel_theta: 0.7
  min_vel_theta: 0.1
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.2
  xy_goal_tolerance: 0.045
  yaw_goal_tolerance: 0.05
  latch_xy_goal_tolerance: true
  sim_time: 1.5
  vx_samples: 12
  vy_samples: 1
  vth_samples: 24
  path_distance_bias: 24.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05
  forward_point_distance: 0.12
  stop_time_buffer: 0.2
  scaling_speed: 0.15
  max_scaling_factor: 0.1
