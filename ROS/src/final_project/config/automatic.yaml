# Mode 2 only. Scene extents are a search boundary, never an occupancy map.
scene_bounds: [-4.0, -3.0, 4.0, 3.0]
exploration_timeout: 1200.0
stable_seconds: 10.0
stable_change_fraction: 0.001
residual_component_area: 0.20
residual_total_area: 0.30
min_frontier_size: 0.30
safe_radius: 0.35
progress_timeout: 60.0
sensor_timeout: 1.0
navigation_timeout: 100.0
navigation_handoff_distance: 0.45
navigation_retries: 1
# Mode 2.1 delivery tuning: tolerate the intermittent ALVAR frame cadence
# observed in the VM while keeping the base stopped during stale intervals.
docking_timeout: 120.0
marker_max_age: 2.0
docking_marker_grace: 3.0
docking_stable_seconds: 0.25
docking_position_tolerance: 0.012
docking_heading_tolerance: 0.04
stations:
  A:
    navigation: [-1.2, 0.30, 1.57079632679]
  B:
    navigation: [1.2, 0.30, 1.57079632679]
docking:
  linear: {kp: 0.6, ki: 0.03, kd: 0.03, limit: 0.06, integral_limit: 0.1}
  angular: {kp: 1.8, ki: 0.02, kd: 0.08, limit: 0.4, integral_limit: 0.15}
